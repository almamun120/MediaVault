name: Android CI

# Every push builds a debug APK and a release APK/AAB (signed when the signing secrets exist).
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed only to attach files to a GitHub Release on version tags

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          # The runner image already ships the Android SDK (ANDROID_HOME). Gradle only needs the licenses accepted
          # so it can fetch any missing platform/build-tools itself.
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Restore auto-generated signing key (fallback when no secrets are set)
        uses: actions/cache@v4
        with:
          path: .signing
          key: mediavault-autokey-v1

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          S_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          S_ALIAS: ${{ secrets.KEY_ALIAS }}
          S_KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Your own permanent key from repository secrets (see SIGNING.md). Kept OUT of the cached folder.
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            KS="$RUNNER_TEMP/release.jks"; PASS="$S_PASS"; ALIAS="$S_ALIAS"; KPASS="$S_KEYPASS"
            echo "Signing with the key from repository secrets."
          else
            # No secrets: create ONE key and keep it in the Actions cache so every build is signed with the same
            # certificate (updates install over each other). If GitHub evicts the cache the key changes and you must
            # uninstall the old app once. For a permanent key set the secrets from SIGNING.md.
            mkdir -p .signing
            if [ ! -f .signing/release.jks ]; then
              openssl rand -hex 16 > .signing/pw.txt
              keytool -genkeypair -keystore .signing/release.jks -alias mediavault -keyalg RSA -keysize 4096 \
                -validity 10000 -storepass "$(cat .signing/pw.txt)" -keypass "$(cat .signing/pw.txt)" \
                -dname "CN=MediaVault, O=Personal, C=BD"
              echo "Generated a new signing key (stored in the Actions cache)."
            else
              echo "Reusing the signing key from the Actions cache."
            fi
            KS="$GITHUB_WORKSPACE/.signing/release.jks"; PASS="$(cat .signing/pw.txt)"; ALIAS="mediavault"; KPASS="$PASS"
          fi
          echo "::add-mask::$PASS"
          echo "::add-mask::$KPASS"
          {
            echo "KEYSTORE_PATH=$KS"
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_ALIAS=$ALIAS"
            echo "KEY_PASSWORD=$KPASS"
          } >> "$GITHUB_ENV"

      - name: Build release APK and AAB
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Verify release signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Collect outputs
        run: |
          mkdir -p dist
          N=${{ github.run_number }}
          cp app/build/outputs/apk/debug/app-debug.apk "dist/MediaVault-debug-$N.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/MediaVault-release-signed-$N.apk"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/MediaVault-release-UNSIGNED-$N.apk"
          fi
          cp app/build/outputs/bundle/release/app-release.aab "dist/MediaVault-release-$N.aab"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaVault-debug
          path: dist/MediaVault-debug-*.apk

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MediaVault-release
          path: |
            dist/MediaVault-release-*.apk
            dist/MediaVault-release-*.aab

      - name: Attach to GitHub Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  unit-tests:
    # Reported separately so a failing test never blocks the APK build.
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Android SDK licenses
        run: |
          # The runner image already ships the Android SDK (ANDROID_HOME). Gradle only needs the licenses accepted
          # so it can fetch any missing platform/build-tools itself.
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
