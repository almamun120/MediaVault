name: Android CI

# Every push builds a debug APK and a release APK/AAB (signed when the signing secrets exist).
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed only to attach files to a GitHub Release on version tags

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          # The runner image already ships the Android SDK (ANDROID_HOME). Gradle only needs the licenses accepted
          # so it can fetch any missing platform/build-tools itself.
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK and AAB
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Verify release signature
        if: env.KEYSTORE_BASE64 != ''
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Collect outputs
        run: |
          mkdir -p dist
          N=${{ github.run_number }}
          cp app/build/outputs/apk/debug/app-debug.apk "dist/MediaVault-debug-$N.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/MediaVault-release-signed-$N.apk"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/MediaVault-release-UNSIGNED-$N.apk"
          fi
          cp app/build/outputs/bundle/release/app-release.aab "dist/MediaVault-release-$N.aab"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaVault-debug
          path: dist/MediaVault-debug-*.apk

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MediaVault-release
          path: |
            dist/MediaVault-release-*.apk
            dist/MediaVault-release-*.aab

      - name: Attach to GitHub Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  unit-tests:
    # Reported separately so a failing test never blocks the APK build.
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Android SDK licenses
        run: |
          # The runner image already ships the Android SDK (ANDROID_HOME). Gradle only needs the licenses accepted
          # so it can fetch any missing platform/build-tools itself.
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
